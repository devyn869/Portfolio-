<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
      :root {
        --bg-color:  #f5f5f5;  /* Deep Navy */
        --card-bg: #1e293b;       /* Lighter Navy for contrast */
        --text-color: #c71585;    /* Off-White / Soft Light */
        --accent-color: #38bdf8;  /* Accent Blue */
        --border-color: #334155;  /* Subtle Border */
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 2rem;
      }

      form {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: 8px;
        max-width: 600px;
        margin: 2rem auto;
        border: 1px solid var(--border-color);
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--text-color);
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      textarea {
        width: 100%;
        padding: 0.75rem;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-color);
        font-size: 1rem;
        box-sizing: border-box;
      }

      input:focus, textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
      }

      fieldset.form-group {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 1rem;
      }

      legend {
        padding: 0 0.5rem;
        font-weight: 500;
      }

      .radio-option {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .radio-option input {
        width: auto;
      }

      .btn-primary {
        background-color: var(--accent-color);
        color: var(--bg-color);
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        transition: opacity 0.2s ease;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }
    </style>
</head>
<body>

    <form action="#" method="POST" novalidate>
      <!-- Standard Text Input with Explicit Label Binding -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required aria-required="true" />
      </div>

      <div class="form-group">
      <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required aria-required="true" />
</div>
<div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required aria-required="true" />
</div>

      <!-- Fieldset and Legend for Grouped Inputs -->
      <fieldset class="form-group">
        <legend>Preferred Contact Method</legend>
        
        <div class="radio-option">
          <input type="radio" id="contact-email" name="contact-method" value="email" checked />
          <label for="contact-email">Email</label>
        </div>
        
        <div class="radio-option">
          <input type="radio" id="contact-phone" name="contact-method" value="phone" />
          <label for="contact-phone">Phone</label>
        </div>
      </fieldset>

      <!-- Textarea with Error State Example -->
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required aria-required="true" aria-invalid="false"></textarea>
        <!-- Accessible error message container -->
        <span id="message-error" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Call-to-Action Button -->
      <button type="submit" class="btn-primary">Send Message</button>
    </form>

</body>
</html>

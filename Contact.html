<form action="#" method="POST" novalidate>
  <!-- Standard Text Input with Explicit Label Binding -->
  <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Devyn Larsen" required aria-required="true" />
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" value="devyn869@gmail.com" required aria-required="true" />
  </div>

  <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" value="816-666-6666" required aria-required="true" />
  </div>

  <!-- Fieldset and Legend for Grouped Inputs -->
  <fieldset class="form-group">
    <legend>Preferred Contact Method</legend>
    
    <div class="radio-option">
      <input type="radio" id="contact-email" name="contact-method" value="email" checked />
      <label for="contact-email">Email</label>
    </div>
    
    <div class="radio-option">
      <input type="radio" id="contact-phone" name="contact-method" value="phone" />
      <label for="contact-phone">Phone</label>
    </div>
  </fieldset>

  <!-- Textarea with Error State Example -->
  <div class="form-group">
    <label for="message">Your Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required aria-required="true" aria-invalid="false"></textarea>
    <!-- Accessible error message container -->
    <span id="message-error" class="error-message" aria-live="polite"></span>
  </div>

  <!-- Call-to-Action Button -->
  <button type="submit" class="btn-primary">Send Message</button>
</form>
